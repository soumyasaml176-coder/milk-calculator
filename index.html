<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Milk Rate Calculator - Pragati & More</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px 25px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }
        
        .header p {
            font-size: 12px;
            opacity: 0.9;
        }
        
        .content {
            padding: 30px 25px;
        }
        
        .form-group {
            margin-bottom: 18px;
        }
        
        label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        select, input {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.3s;
        }
        
        select:focus, input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .input-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        .input-row .form-group {
            margin-bottom: 0;
        }
        
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .result-section {
            margin-top: 25px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }
        
        .result-item {
            margin-bottom: 15px;
        }
        
        .result-item:last-child {
            margin-bottom: 0;
        }
        
        .result-label {
            font-size: 13px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }
        
        .result-value {
            font-size: 28px;
            font-weight: 700;
            color: #667eea;
            margin-top: 5px;
        }
        
        .result-value.secondary {
            font-size: 18px;
            color: #764ba2;
        }
        
        .error-message {
            background: #fee;
            color: #c33;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            margin-top: 15px;
            border-left: 4px solid #c33;
            display: none;
        }
        
        .error-message.show {
            display: block;
        }
        
        .success-message {
            background: #efe;
            color: #3c3;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            margin-top: 15px;
            border-left: 4px solid #3c3;
            display: none;
        }
        
        .success-message.show {
            display: block;
        }
        
        .info-box {
            background: #f0f4ff;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 12px;
            color: #555;
            margin-top: 15px;
            border-left: 4px solid #667eea;
        }
        
        .info-box strong {
            color: #667eea;
        }
        
        .divider {
            height: 1px;
            background: #e0e0e0;
            margin: 20px 0;
        }
        
        .history-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #e0e0e0;
        }
        
        .history-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
            font-size: 14px;
        }
        
        .history-item {
            background: #f8f9fa;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 12px;
            color: #666;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .history-item .price {
            font-weight: 700;
            color: #667eea;
        }
        
        .clear-history {
            font-size: 12px;
            color: #999;
            cursor: pointer;
            text-decoration: underline;
            margin-top: 8px;
        }
        
        .clear-history:hover {
            color: #666;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🥛 Milk Rate Calculator</h1>
        <p>Pragati & Multi-Model Pricing Support</p>
    </div>
    
    <div class="content">
        <div class="form-group">
            <label for="model">Pricing Model</label>
            <select id="model" onchange="updateModelInfo()">
                <option value="pragati">Pragati Milk Products (Latest)</option>
                <option value="formula">Simple Formula (FAT × 6.5 + SNF × 1.8 - 0.05)</option>
            </select>
        </div>
        
        <div id="modelInfo" class="info-box"></div>
        
        <div class="input-row">
            <div class="form-group">
                <label for="fat">FAT %</label>
                <input type="number" id="fat" step="0.01" placeholder="e.g., 4.50" min="0" max="10">
            </div>
            <div class="form-group">
                <label for="snf">SNF %</label>
                <input type="number" id="snf" step="0.01" placeholder="e.g., 8.50" min="0" max="10">
            </div>
        </div>
        
        <div class="form-group">
            <label for="quantity">Quantity (Liters)</label>
            <input type="number" id="quantity" step="0.1" placeholder="e.g., 10" value="1" min="0.1">
        </div>
        
        <button onclick="calculateRate()">Calculate Price</button>
        
        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>
        
        <div class="result-section" id="resultSection" style="display: none;">
            <div class="result-item">
                <div class="result-label">Rate per Liter</div>
                <div class="result-value" id="rateDisplay">₹ 0.00</div>
            </div>
            
            <div class="divider"></div>
            
            <div class="result-item">
                <div class="result-label">Total Amount</div>
                <div class="result-value secondary" id="totalDisplay">₹ 0.00</div>
            </div>
        </div>
        
        <div class="info-box">
            <strong>⚠️ Terms & Conditions:</strong><br>
            ❌ No payment if FAT &lt; 3.2% or SNF &lt; 7.5%<br>
            ❌ Adulterated milk not acceptable
        </div>
        
        <div class="history-section" id="historySection" style="display: none;">
            <div class="history-title">Recent Calculations</div>
            <div id="historyList"></div>
            <div class="clear-history" onclick="clearHistory()">Clear History</div>
        </div>
    </div>
</div>

};

let calculationHistory = JSON.parse(localStorage.getItem('milkCalcHistory')) || [];

function updateModelInfo() {
    const model = document.getElementById('model').value;
    const infoBox = document.getElementById('modelInfo');
    
    if (model === 'pragati') {
        infoBox.innerHTML = '<strong>Pragati Milk Products</strong><br>Using official pricing table (W.E.F 21.05.2026)<br>Accurate lookup for FAT & SNF combinations';
    } else {
        infoBox.innerHTML = '<strong>Simple Formula</strong><br>(FAT × 6.5) + (SNF × 1.8) - 0.05<br>Quick estimation for custom pricing';
    }
}

function interpolatePrice(fat, snf) {
    // Round to nearest 0.01
    fat = Math.round(fat * 100) / 100;
    snf = Math.round(snf * 100) / 100;
    
    const fatKey = fat.toFixed(2);
    const snfKey = snf.toFixed(2);
    
    // Direct lookup
    if (pragatiPrices[fatKey] && pragatiPrices[fatKey][snfKey]) {
        return pragatiPrices[fatKey][snfKey];
    }
    
    // Interpolation logic for values not in table
    const fatKeys = Object.keys(pragatiPrices).map(Number).sort((a, b) => a - b);
    const snfKeys = ['7.50', '7.60', '7.70', '7.80', '7.90', '8.00', '8.10', '8.20', '8.30', '8.40', '8.50', '8.60', '8.70', '8.80', '8.90', '9.00'].map(Number).sort((a, b) => a - b);
    
    let fat1 = fatKeys[0], fat2 = fatKeys[fatKeys.length - 1];
    for (let i = 0; i < fatKeys.length - 1; i++) {
        if (fat >= fatKeys[i] && fat <= fatKeys[i + 1]) {
            fat1 = fatKeys[i];
            fat2 = fatKeys[i + 1];
            break;
        }
    }
    
    let snf1 = snfKeys[0], snf2 = snfKeys[snfKeys.length - 1];
    for (let i = 0; i < snfKeys.length - 1; i++) {
        if (snf >= snfKeys[i] && snf <= snfKeys[i + 1]) {
            snf1 = snfKeys[i];
            snf2 = snfKeys[i + 1];
            break;
        }
    }
    
    // Bilinear interpolation
    const p11 = pragatiPrices[fat1.toFixed(2)][snf1.toFixed(2)];
    const p12 = pragatiPrices[fat1.toFixed(2)][snf2.toFixed(2)];
    const p21 = pragatiPrices[fat2.toFixed(2)][snf1.toFixed(2)];
    const p22 = pragatiPrices[fat2.toFixed(2)][snf2.toFixed(2)];
    
    const tx = (fat - fat1) / (fat2 - fat1);
    const ty = (snf - snf1) / (snf2 - snf1);
    
    const p1 = p11 * (1 - tx) + p21 * tx;
    const p2 = p12 * (1 - tx) + p22 * tx;
    const price = p1 * (1 - ty) + p2 * ty;
    
    return price;
}

function calculateRate() {
    const fat = parseFloat(document.getElementById('fat').value);
    const snf = parseFloat(document.getElementById('snf').value);
    const quantity = parseFloat(document.getElementById('quantity').value) || 1;
    const model = document.getElementById('model').value;
    
    const errorDiv = document.getElementById('errorMessage');
    const successDiv = document.getElementById('successMessage');
    const resultSection = document.getElementById('resultSection');
    const rateDiv = document.getElementById('rateDisplay');
    const totalDiv = document.getElementById('totalDisplay');
    
    errorDiv.classList.remove('show');
    successDiv.classList.remove('show');
    
    // Validation
    if (isNaN(fat) || isNaN(snf)) {
        errorDiv.textContent = '❌ Please enter valid FAT and SNF values.';
        errorDiv.classList.add('show');
        resultSection.style.display = 'none';
        return;
    }
    
    // Rejection threshold
    if (fat < 3.2 || snf < 7.5) {
        errorDiv.textContent = '❌ No Payment: FAT < 3.2% or SNF < 7.5%';
        errorDiv.classList.add('show');
        resultSection.style.display = 'none';
        return;
    }
    
    let ratePerLiter;
    let method;
    
    if (model === 'pragati') {
        ratePerLiter = interpolatePrice(fat, snf);
        method = 'Pragati';
    } else {
        ratePerLiter = (fat * 6.5) + (snf * 1.8) - 0.05;
        method = 'Formula';
    }
    
    const totalAmount = ratePerLiter * quantity;
    
    rateDiv.textContent = '₹ ' + ratePerLiter.toFixed(2);
    totalDiv.textContent = '₹ ' + totalAmount.toFixed(2);
    
    resultSection.style.display = 'block';
    successDiv.textContent = `✅ Calculated using ${method} model`;
    successDiv.classList.add('show');
    
    // Add to history
    addToHistory(fat, snf, quantity, ratePerLiter, totalAmount);
}

function addToHistory(fat, snf, qty, rate, total) {
    const entry = {
        timestamp: new Date().toLocaleString(),
        fat: fat.toFixed(2),
        snf: snf.toFixed(2),
        qty: qty.toFixed(1),
        rate: rate.toFixed(2),
        total: total.toFixed(2)
    };
    
    calculationHistory.unshift(entry);
    if (calculationHistory.length > 10) calculationHistory.pop();
    
    localStorage.setItem('milkCalcHistory', JSON.stringify(calculationHistory));
    displayHistory();
}

function displayHistory() {
    const historySection = document.getElementById('historySection');
    const historyList = document.getElementById('historyList');
    
    if (calculationHistory.length === 0) {
        historySection.style.display = 'none';
        return;
    }
    
    historySection.style.display = 'block';
    historyList.innerHTML = calculationHistory.map(entry => `
        <div class="history-item">
            <span>FAT ${entry.fat}% + SNF ${entry.snf}% × ${entry.qty}L</span>
            <span class="price">₹${entry.total}</span>
        </div>
    `).join('');
}

function clearHistory() {
    calculationHistory = [];
    localStorage.removeItem('milkCalcHistory');
    displayHistory();
}

// Initialize
updateModelInfo();
displayHistory();
</script>
